<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-label="How an export works: an area becomes a grid on whole pixels, the grid becomes tiles, the tiles become one GeoTIFF written atomically">
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .chip{fill:#f0efec}
  .ln{stroke:#7a7974} .box{fill:#f0efec;stroke:#b9b8b2}
  @media (prefers-color-scheme: dark){ .bg{fill:#1a1a19} .t1{fill:#f0efec} .t2{fill:#c3c2b7}
    .chip{fill:#2a2a28} .ln{stroke:#9a9993} .box{fill:#2a2a28;stroke:#55544f} }
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="1000" height="260" rx="14"/>
<rect class="box" x="40" y="58" width="200" height="122" rx="10"/>
<path d="M70 150 C 90 90, 150 70, 210 100 L 200 160 Z" fill="#efb27a" opacity=".8"/>
<text class="t1" x="140" y="210" font-size="15" text-anchor="middle">1. an area</text>
<text class="t2" x="140" y="232" font-size="13" text-anchor="middle">lon/lat, any shape of box</text>
<line class="ln" x1="252" y1="119" x2="352" y2="119" stroke-width="2" marker-end="url(#a)"/>
<text class="t2" x="302" y="108" font-size="12" text-anchor="middle">snap</text>
<rect x="372" y="58" width="46" height="38" rx="3" fill="#8db8ec"/><rect x="422" y="58" width="46" height="38" rx="3" fill="#2a78d6"/><rect x="472" y="58" width="46" height="38" rx="3" fill="#5f9ae0"/><rect x="522" y="58" width="22" height="38" rx="3" fill="#8db8ec"/><rect x="372" y="100" width="46" height="38" rx="3" fill="#2a78d6"/><rect x="422" y="100" width="46" height="38" rx="3" fill="#5f9ae0"/><rect x="472" y="100" width="46" height="38" rx="3" fill="#8db8ec"/><rect x="522" y="100" width="22" height="38" rx="3" fill="#2a78d6"/><rect x="372" y="142" width="46" height="38" rx="3" fill="#5f9ae0"/><rect x="422" y="142" width="46" height="38" rx="3" fill="#8db8ec"/><rect x="472" y="142" width="46" height="38" rx="3" fill="#2a78d6"/><rect x="522" y="142" width="22" height="38" rx="3" fill="#5f9ae0"/>
<text class="t1" x="470" y="210" font-size="15" text-anchor="middle">2. a grid of whole pixels, cut in tiles</text>
<text class="t2" x="470" y="232" font-size="13" text-anchor="middle">every edge a multiple of the resolution</text>
<line class="ln" x1="586" y1="119" x2="676" y2="119" stroke-width="2" marker-end="url(#a)"/>
<text class="t2" x="631" y="108" font-size="12" text-anchor="middle">exportImage</text>
<rect class="box" x="690" y="58" width="122" height="122" rx="10"/>
<rect x="702" y="70" width="98" height="98" rx="4" fill="#2a78d6" opacity=".85"/>
<text class="t1" x="751" y="124" font-size="13" text-anchor="middle">GeoTIFF</text>
<rect class="chip" x="830" y="70" width="130" height="30" rx="15"/><text class="t2" x="895" y="90" font-size="12" text-anchor="middle">out.tif.part</text>
<line class="ln" x1="895" y1="104" x2="895" y2="132" stroke-width="2" marker-end="url(#a)"/>
<rect class="chip" x="830" y="136" width="130" height="30" rx="15"/><text class="t1" x="895" y="156" font-size="12" text-anchor="middle">out.tif</text>
<text class="t1" x="825" y="210" font-size="15" text-anchor="middle">3. one file, renamed only when whole</text>
<text class="t2" x="825" y="232" font-size="13" text-anchor="middle">a failed tile leaves nothing behind</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a7974"/></marker></defs>
</svg>
