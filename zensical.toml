[project]
site_name = "imageserver-export"
site_description = "Open land-cover maps of Europe, as clean GeoTIFFs, in a few lines of Python (ArcGIS ImageServer, Copernicus Land)"
site_url = "https://agentengineering.it/imageserver-export/"
repo_url = "https://github.com/agent-engineering-studio/imageserver-export"
repo_name = "agent-engineering-studio/imageserver-export"
edit_uri = "edit/main/docs/"
copyright = "Code Apache-2.0. Copernicus Land data © European Union, Copernicus Land Monitoring Service, EEA."

nav = [
  { "Home" = "index.md" },
  { "API reference" = [
    { "Client" = "api/client.md" },
    { "Grid and tiles" = "api/grid.md" },
    { "Requests (pure functions)" = "api/request.md" },
    { "Service descriptions" = "api/service.md" },
    { "Mosaic writer" = "api/mosaic.md" },
    { "Coarse cells" = "api/aggregate.md" },
    { "Errors" = "api/errors.md" },
  ] },
  { "Changelog" = "changelog.md" },
  { "Contributing" = "contributing.md" },
]

exclude_docs = """
make_images.py
"""

[project.theme]
features = [
  "navigation.sections",
  "navigation.top",
  "content.code.copy",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep orange"
toggle.icon = "lucide/moon"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_root_heading = true
show_source = false
members_order = "source"
separate_signature = true
show_signature_annotations = true
filters = ["!^_"]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions."pymdownx.highlight"]
[project.markdown_extensions."pymdownx.inlinehilite"]

[project.markdown_extensions."pymdownx.snippets"]
base_path = ["."]
check_paths = true

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
