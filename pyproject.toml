[project]
name = "imageserver-export"
version = "0.2.0"
description = "Export ArcGIS ImageServer rasters (like the open Copernicus Land layers the EEA serves) to aligned, atomic GeoTIFF mosaics"
readme = "README.md"
keywords = ["arcgis", "imageserver", "geotiff", "raster", "copernicus", "eea", "land monitoring", "imperviousness", "gis"]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Giuseppe Zileni", email = "giuseppe.zileni@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "rasterio>=1.3",
]

[project.optional-dependencies]
# The imageserver-mcp server for AI agents: imageserver_export.mcp_server.
mcp = [
    "mcp>=2.0",
]

[project.scripts]
imageserver-mcp = "imageserver_export.mcp_server:main"

[project.urls]
Homepage = "https://github.com/agent-engineering-studio/imageserver-export"
Issues = "https://github.com/agent-engineering-studio/imageserver-export/issues"
Changelog = "https://github.com/agent-engineering-studio/imageserver-export/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "imageserver-export[mcp]",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

docs = [
    "zensical>=0.1.0",
    "mkdocstrings[python]>=0.26",
    "matplotlib>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "B018"]
# SVG markup in strings: the lines are as long as the drawing needs.
"docs/make_images.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["rasterio.*", "affine.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["imageserver_export"]

[tool.coverage.report]
fail_under = 90
show_missing = true
