site_name: imageserver-export
site_description: Open land-cover maps of Europe, as clean GeoTIFFs, in a few lines of Python (ArcGIS ImageServer, Copernicus Land)
site_url: https://agentengineering.it/imageserver-export/
repo_url: https://github.com/agent-engineering-studio/imageserver-export
repo_name: agent-engineering-studio/imageserver-export
edit_uri: edit/main/docs/
copyright: Code Apache-2.0. Copernicus Land data © European Union, Copernicus Land Monitoring Service, EEA.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets: {base_path: ["."], check_paths: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  make_images.py

nav:
  - Home: index.md
  - API reference:
      - Client: api/client.md
      - Grid and tiles: api/grid.md
      - Requests (pure functions): api/request.md
      - Service descriptions: api/service.md
      - Mosaic writer: api/mosaic.md
      - Coarse cells: api/aggregate.md
      - Errors: api/errors.md
  - Changelog: changelog.md
  - Contributing: contributing.md

# The README is written for GitHub: its relative links (LICENSE) point at the
# repository, not at the site.
validation:
  links:
    not_found: info
    unrecognized_links: info
